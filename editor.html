<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Editor</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2e2e2e;
    }
    #toolbar {
      position: absolute;
      top: 0;
      left: 0;
      width: 60px;
      height: 100%;
      background: #1e1e1e;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      box-shadow: 2px 0 5px rgba(0,0,0,0.5);
      z-index: 10;
    }
    #toolbar button {
      background: none;
      border: none;
      margin: 10px 0;
      color: white;
      cursor: pointer;
    }
    canvas {
      position: absolute;
      left: 60px;
      top: 0;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button onclick="activateTool('zoomIn')">🔍+</button>
    <button onclick="activateTool('zoomOut')">🔍-</button>
    <button onclick="activateTool('draw')">✏️</button>
    <button onclick="activateTool('eraser')">🧽</button>
    <button onclick="activateTool('text')">🔤</button>
    <button onclick="activateTool('invert')">🌓</button>
    <button onclick="activateTool('saturation')">🎨</button>
    <button onclick="activateTool('brightness')">💡</button>
    <button onclick="activateTool('contrast')">🌓</button>
    <button onclick="activateTool('crop')">✂️</button>
    <button onclick="downloadImage()">⬇️</button>
  </div>

  <canvas id="editorCanvas"></canvas>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    let scale = 1;
    let tool = '';
    let img = new Image();
    let isDrawing = false;
    let startX, startY;

    canvas.width = window.innerWidth - 60;
    canvas.height = window.innerHeight;

    window.onload = () => {
      const data = localStorage.getItem('imageData');
      if (!data) {
        alert("No image found. Please upload again.");
        location.href = "index.html";
        return;
      }
      img.onload = () => {
        drawImage();
      };
      img.src = data;
    };

    function drawImage() {
      canvas.width = window.innerWidth - 60;
      canvas.height = window.innerHeight;
      ctx.setTransform(scale, 0, 0, scale, 0, 0);
      ctx.drawImage(img, 0, 0);
    }

    function activateTool(selected) {
      tool = selected;
      if (tool === 'zoomIn') {
        scale += 0.1;
        drawImage();
      } else if (tool === 'zoomOut') {
        scale = Math.max(0.1, scale - 0.1);
        drawImage();
      } else if (tool === 'invert') {
        let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          d[i] = 255 - d[i];
          d[i+1] = 255 - d[i+1];
          d[i+2] = 255 - d[i+2];
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (tool === 'download') {
        downloadImage();
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      if (tool === 'draw' || tool === 'eraser' || tool === 'crop') {
        isDrawing = true;
        startX = e.offsetX;
        startY = e.offsetY;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
      }
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      if (tool === 'draw') {
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.strokeStyle = 'red';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (tool === 'eraser') {
        ctx.clearRect(e.offsetX - 5, e.offsetY - 5, 10, 10);
      }
    });

    canvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      if (tool === 'crop') {
        const endX = e.offsetX;
        const endY = e.offsetY;
        const cropWidth = endX - startX;
        const cropHeight = endY - startY;
        const cropped = ctx.getImageData(startX, startY, cropWidth, cropHeight);
        canvas.width = cropWidth;
        canvas.height = cropHeight;
        ctx.putImageData(cropped, 0, 0);
      }
    });

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'edited_image.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
