<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>editmyphoto010 - Editor</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 {
      color: #facc15;
    }
    .controls, .sliders, .text-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    canvas {
      border: 2px solid white;
      margin: 20px auto;
      display: block;
      border-radius: 10px;
      max-width: 100%;
    }
    input[type="file"], input[type="range"], input[type="color"], input[type="text"], button, select {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }
    button {
      background-color: #facc15;
      color: black;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #fbbf24;
    }
  </style>
</head>
<body>
  <h1>Welcome to editmyphoto010</h1>
  <p>Edit your photo privately and smoothly – no upload to any server!</p>  <input type="file" id="upload" accept="image/*">
  <canvas id="canvas" width="600" height="400"></canvas>  <div class="controls">
    <button onclick="rotate(90)">Rotate Right</button>
    <button onclick="rotate(-90)">Rotate Left</button>
    <button onclick="flip('horizontal')">Flip Horizontal</button>
    <button onclick="flip('vertical')">Flip Vertical</button>
    <button onclick="applyFilter('grayscale')">Grayscale</button>
    <button onclick="applyFilter('sepia')">Sepia</button>
    <button onclick="applyFilter('invert')">Invert</button>
    <button onclick="drawMode = true">Draw</button>
    <button onclick="drawMode = false">Stop Drawing</button>
    <button onclick="clearCanvas()">Clear</button>
    <button onclick="undo()">Undo</button>
    <button onclick="redo()">Redo</button>
    <button onclick="downloadImage()">Download</button>
  </div>  <div class="sliders">
    <label>Brightness <input type="range" min="-100" max="100" value="0" oninput="adjust('brightness', this.value)"></label>
    <label>Contrast <input type="range" min="-100" max="100" value="0" oninput="adjust('contrast', this.value)"></label>
    <label>Saturation <input type="range" min="-100" max="100" value="0" oninput="adjust('saturation', this.value)"></label>
  </div>  <div class="text-controls">
    <input type="text" id="text-input" placeholder="Add text">
    <input type="color" id="text-color" value="#ffffff">
    <input type="range" id="text-size" min="10" max="100" value="30">
    <button onclick="addText()">Add Text</button>
  </div>  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();
    let drawMode = false;
    let isDrawing = false;
    let history = [], redoStack = [];

    document.getElementById('upload').addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = () => {
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          saveState();
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(e.target.files[0]);
    });

    function saveState() {
      history.push(canvas.toDataURL());
      redoStack = [];
    }

    function undo() {
      if (history.length > 1) {
        redoStack.push(history.pop());
        let last = new Image();
        last.onload = () => ctx.drawImage(last, 0, 0);
        last.src = history[history.length - 1];
      }
    }

    function redo() {
      if (redoStack.length) {
        const next = redoStack.pop();
        let imgRedo = new Image();
        imgRedo.onload = () => {
          ctx.drawImage(imgRedo, 0, 0);
          history.push(next);
        };
        imgRedo.src = next;
      }
    }

    function rotate(deg) {
      const temp = document.createElement('canvas');
      const tctx = temp.getContext('2d');
      temp.width = canvas.height;
      temp.height = canvas.width;
      tctx.translate(temp.width/2, temp.height/2);
      tctx.rotate(deg * Math.PI / 180);
      tctx.drawImage(canvas, -canvas.width/2, -canvas.height/2);
      canvas.width = temp.width;
      canvas.height = temp.height;
      ctx.drawImage(temp, 0, 0);
      saveState();
    }

    function flip(dir) {
      ctx.save();
      if (dir === 'horizontal') ctx.scale(-1, 1);
      else ctx.scale(1, -1);
      ctx.drawImage(canvas, dir === 'horizontal' ? -canvas.width : 0, dir === 'vertical' ? -canvas.height : 0);
      ctx.restore();
      saveState();
    }

    function applyFilter(type) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      for (let i = 0; i < data.length; i += 4) {
        let r = data[i], g = data[i+1], b = data[i+2];
        if (type === 'grayscale') {
          const avg = (r + g + b) / 3;
          data[i] = data[i+1] = data[i+2] = avg;
        } else if (type === 'sepia') {
          data[i] = r * 0.393 + g * 0.769 + b * 0.189;
          data[i+1] = r * 0.349 + g * 0.686 + b * 0.168;
          data[i+2] = r * 0.272 + g * 0.534 + b * 0.131;
        } else if (type === 'invert') {
          data[i] = 255 - r;
          data[i+1] = 255 - g;
          data[i+2] = 255 - b;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      saveState();
    }

    function adjust(type, value) {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      const v = parseInt(value);
      for (let i = 0; i < data.length; i += 4) {
        if (type === 'brightness') {
          data[i] += v; data[i+1] += v; data[i+2] += v;
        } else if (type === 'contrast') {
          const factor = (259 * (v + 255)) / (255 * (259 - v));
          data[i] = factor * (data[i] - 128) + 128;
          data[i+1] = factor * (data[i+1] - 128) + 128;
          data[i+2] = factor * (data[i+2] - 128) + 128;
        } else if (type === 'saturation') {
          const avg = (data[i] + data[i+1] + data[i+2]) / 3;
          data[i] += (data[i] - avg) * (v / 100);
          data[i+1] += (data[i+1] - avg) * (v / 100);
          data[i+2] += (data[i+2] - avg) * (v / 100);
        }
      }
      ctx.putImageData(imageData, 0, 0);
    }

    canvas.addEventListener('mousedown', e => { if (drawMode) isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
    canvas.addEventListener('mousemove', e => { if (isDrawing && drawMode) { ctx.lineTo(e.offsetX, e.offsetY); ctx.strokeStyle = 'white'; ctx.lineWidth = 2; ctx.stroke(); } });
    canvas.addEventListener('mouseup', () => { if (drawMode) { isDrawing = false; saveState(); } });

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      saveState();
    }

    function addText() {
      const text = document.getElementById('text-input').value;
      const color = document.getElementById('text-color').value;
      const size = document.getElementById('text-size').value;
      ctx.fillStyle = color;
      ctx.font = `${size}px sans-serif`;
      ctx.fillText(text, 50, 50);
      saveState();
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script></body>
</html>
