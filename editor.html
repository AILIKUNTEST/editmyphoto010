<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Editor - editmyphoto010</title>
  <link href="https://unpkg.com/cropperjs/dist/cropper.min.css" rel="stylesheet"/>
  <style>
    body {
      background: #0f172a;
      font-family: sans-serif;
      color: white;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    input, button, select {
      margin: 5px;
      padding: 10px;
      font-size: 16px;
    }

    canvas {
      max-width: 100%;
      margin: 20px auto;
      border: 2px solid white;
      display: block;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .btn {
      background-color: white;
      color: black;
      font-weight: bold;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #facc15;
    }
  </style>
</head>
<body>

  <h1>editmyphoto010 - Photo Editor</h1>
  <input type="file" id="upload" accept="image/*" />
  <br/>
  <canvas id="canvas"></canvas>

  <div class="controls">
    <button onclick="rotate(-90)" class="btn">Rotate Left</button>
    <button onclick="rotate(90)" class="btn">Rotate Right</button>
    <button onclick="flip('horizontal')" class="btn">Flip Horizontal</button>
    <button onclick="flip('vertical')" class="btn">Flip Vertical</button>
    <button onclick="applyFilter('grayscale(100%)')" class="btn">Grayscale</button>
    <button onclick="applyFilter('sepia(100%)')" class="btn">Sepia</button>
    <button onclick="applyFilter('blur(5px)')" class="btn">Blur</button>
    <button onclick="resetFilter()" class="btn">Reset</button>
    <button onclick="addBorder()" class="btn">Add Border</button>
    <button onclick="addShadow()" class="btn">Add Shadow</button>
    <button onclick="download()" class="btn">Download</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    let img = new Image();
    let currentAngle = 0;
    let flipX = 1;
    let flipY = 1;
    let originalImage;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(img, 0, 0);
          originalImage = ctx.getImageData(0, 0, canvas.width, canvas.height);
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function rotate(deg) {
      currentAngle = (currentAngle + deg) % 360;
      drawTransformed();
    }

    function flip(direction) {
      if (direction === 'horizontal') flipX *= -1;
      if (direction === 'vertical') flipY *= -1;
      drawTransformed();
    }

    function drawTransformed() {
      const radians = currentAngle * Math.PI / 180;
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.setTransform(flipX * Math.cos(radians), Math.sin(radians),
                       -Math.sin(radians), flipY * Math.cos(radians),
                       canvas.width / 2, canvas.height / 2);
      ctx.clearRect(-canvas.width / 2, -canvas.height / 2, canvas.width, canvas.height);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
    }

    function applyFilter(filter) {
      canvas.style.filter = filter;
    }

    function resetFilter() {
      canvas.style.filter = 'none';
    }

    function addBorder() {
      ctx.lineWidth = 20;
      ctx.strokeStyle = 'yellow';
      ctx.strokeRect(0, 0, canvas.width, canvas.height);
    }

    function addShadow() {
      ctx.shadowColor = 'black';
      ctx.shadowBlur = 15;
      ctx.shadowOffsetX = 10;
      ctx.shadowOffsetY = 10;
      ctx.drawImage(img, 0, 0);
    }

    function download() {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
