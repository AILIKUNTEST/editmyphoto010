<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>editmyphoto010 - Professional Editor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f3f4f6, #e5e7eb);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      color: #111827;
    }
    header {
      background: #111827;
      color: white;
      padding: 1rem 2rem;
      font-size: 1.5rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem;
      flex: 1;
    }
    .tools {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      width: 100%;
      max-width: 900px;
      margin-bottom: 2rem;
    }
    .tools button, .tools input[type=range], .tools input[type=color], .tools select {
      padding: 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 0.5rem;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tools button:hover {
      background: #f9fafb;
    }
    canvas {
      border: 2px solid #d1d5db;
      border-radius: 1rem;
      max-width: 100%;
    }
    footer {
      background: #f3f4f6;
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    editmyphoto010
  </header>
  <div class="container">
    <input type="file" id="upload" accept="image/*">
    <canvas id="canvas" width="800" height="600"></canvas><div class="tools">
  <button onclick="cropImage()">Crop</button>
  <button onclick="resizeImage()">Resize</button>
  <button onclick="rotateImage()">Rotate</button>
  <button onclick="flipImage()">Flip</button>
  <button onclick="applyFilter('grayscale')">Grayscale</button>
  <button onclick="applyFilter('sepia')">Sepia</button>
  <button onclick="applyFilter('invert')">Invert</button>
  <button onclick="adjustBrightness(10)">Bright+</button>
  <button onclick="adjustBrightness(-10)">Bright-</button>
  <button onclick="adjustContrast(10)">Contrast+</button>
  <button onclick="adjustContrast(-10)">Contrast-</button>
  <button onclick="adjustSaturation(10)">Saturate+</button>
  <button onclick="adjustSaturation(-10)">Saturate-</button>
  <button onclick="enableDraw()">Draw</button>
  <button onclick="enableEraser()">Eraser</button>
  <input type="color" id="colorPicker">
  <button onclick="addText()">Add Text</button>
  <button onclick="undo()">Undo</button>
  <button onclick="redo()">Redo</button>
  <button onclick="zoomIn()">Zoom In</button>
  <button onclick="zoomOut()">Zoom Out</button>
  <button onclick="pixelateImage()">Pixelate</button>
  <button onclick="downloadImage()">Download</button>
</div>

  </div>  <footer>
    © 2025 editmyphoto010. All editing is done locally in your browser for privacy.
  </footer>  <script>
    // BASIC CANVAS SETUP
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('upload');
    const colorPicker = document.getElementById('colorPicker');
    let image = new Image();
    let drawing = false, erasing = false;
    let history = [], redoStack = [];
    let zoomLevel = 1;

    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = () => {
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    image.onload = () => {
      canvas.width = image.width;
      canvas.height = image.height;
      ctx.drawImage(image, 0, 0);
      saveState();
    };

    function saveState() {
      history.push(canvas.toDataURL());
      if (history.length > 30) history.shift();
    }

    function undo() {
      if (history.length > 1) {
        redoStack.push(history.pop());
        let img = new Image();
        img.src = history[history.length - 1];
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
    }

    function redo() {
      if (redoStack.length > 0) {
        let img = new Image();
        img.src = redoStack.pop();
        img.onload = () => {
          ctx.drawImage(img, 0, 0);
          history.push(img.src);
        };
      }
    }

    function applyFilter(filter) {
      ctx.filter = filter;
      ctx.drawImage(canvas, 0, 0);
      ctx.filter = 'none';
      saveState();
    }

    function adjustBrightness(val) {
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < imageData.data.length; i += 4) {
        imageData.data[i] += val;
        imageData.data[i+1] += val;
        imageData.data[i+2] += val;
      }
      ctx.putImageData(imageData, 0, 0);
      saveState();
    }

    function adjustContrast(val) {
      let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let factor = (259 * (val + 255)) / (255 * (259 - val));
      for (let i = 0; i < imageData.data.length; i += 4) {
        imageData.data[i] = factor * (imageData.data[i] - 128) + 128;
        imageData.data[i+1] = factor * (imageData.data[i+1] - 128) + 128;
        imageData.data[i+2] = factor * (imageData.data[i+2] - 128) + 128;
      }
      ctx.putImageData(imageData, 0, 0);
      saveState();
    }

    function adjustSaturation(val) {
      // Basic placeholder: more complex logic can be added
      applyFilter(`saturate(${100 + val}%)`);
    }

    function addText() {
      const text = prompt("Enter text:");
      if (text) {
        ctx.fillStyle = colorPicker.value;
        ctx.font = "30px Inter";
        ctx.fillText(text, 50, 50);
        saveState();
      }
    }

    function enableDraw() {
      drawing = true;
      erasing = false;
    }

    function enableEraser() {
      erasing = true;
      drawing = false;
    }

    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => {
      drawing = false;
      saveState();
    });
    canvas.addEventListener('mousemove', draw);

    function draw(e) {
      if (!drawing && !erasing) return;
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left);
      const y = (e.clientY - rect.top);
      ctx.fillStyle = erasing ? "white" : colorPicker.value;
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'edited-image.png';
      link.href = canvas.toDataURL();
      link.click();
    }

    function zoomIn() {
      zoomLevel += 0.1;
      canvas.style.transform = `scale(${zoomLevel})`;
    }
    function zoomOut() {
      zoomLevel -= 0.1;
      canvas.style.transform = `scale(${zoomLevel})`;
    }

    function pixelateImage() {
      let scale = 0.1;
      let tempCanvas = document.createElement('canvas');
      let tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = canvas.width * scale;
      tempCanvas.height = canvas.height * scale;
      tempCtx.drawImage(canvas, 0, 0, tempCanvas.width, tempCanvas.height);
      ctx.imageSmoothingEnabled = false;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(tempCanvas, 0, 0, tempCanvas.width, tempCanvas.height, 0, 0, canvas.width, canvas.height);
      saveState();
    }

    function cropImage() {
      // Basic static crop for demonstration
      let cropWidth = canvas.width * 0.8;
      let cropHeight = canvas.height * 0.8;
      let imageData = ctx.getImageData(0, 0, cropWidth, cropHeight);
      canvas.width = cropWidth;
      canvas.height = cropHeight;
      ctx.putImageData(imageData, 0, 0);
      saveState();
    }

    function resizeImage() {
      let w = parseInt(prompt("Enter new width:", canvas.width));
      let h = parseInt(prompt("Enter new height:", canvas.height));
      if (w && h) {
        let temp = document.createElement('canvas');
        let tempCtx = temp.getContext('2d');
        temp.width = w;
        temp.height = h;
        tempCtx.drawImage(canvas, 0, 0, w, h);
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(temp, 0, 0);
        saveState();
      }
    }

    function rotateImage() {
      let temp = document.createElement('canvas');
      let tempCtx = temp.getContext('2d');
      temp.width = canvas.height;
      temp.height = canvas.width;
      tempCtx.translate(temp.width / 2, temp.height / 2);
      tempCtx.rotate(Math.PI / 2);
      tempCtx.drawImage(canvas, -canvas.width / 2, -canvas.height / 2);
      canvas.width = temp.width;
      canvas.height = temp.height;
      ctx.drawImage(temp, 0, 0);
      saveState();
    }

    function flipImage() {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(canvas, 0, 0);
      saveState();
    }
  </script></body>
</html>
