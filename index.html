<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>editmyphoto010 - Photo Editor</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #4e54c8, #8f94fb);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: white;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 0.5em;
    }
    input[type="file"] {
      margin: 1em;
    }
    button {
      background-color: white;
      color: #4e54c8;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h1>Welcome to editmyphoto010</h1>
  <p>Upload your photo to start editing</p>
  <input type="file" id="photoInput" accept="image/*">
  <br>
  <button onclick="startEditing()">Start Editing</button>

  <script>
    function startEditing() {
      const input = document.getElementById('photoInput');
      if (!input.files[0]) {
        alert('Please select a photo first!');
        return;
      }

      const reader = new FileReader();
      reader.onload = function (e) {
        localStorage.setItem('imageData', e.target.result);
        window.location.href = 'editor.html';
      };
      reader.readAsDataURL(input.files[0]);
    }
  </script>
</body>
</html>
